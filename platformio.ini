; BadCard — BadUSB for the M5Stack Cardputer / Cardputer ADV
; The Cardputer ADV keyboard is a TCA8418 I2C expander, which needs
; M5Cardputer >= 1.1.1 (https://github.com/VoidNoi/BadCard/issues/19).

[env:m5stack-cardputer]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
board_build.partitions = huge_app.csv
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    h2zero/NimBLE-Arduino@^1.4.3
